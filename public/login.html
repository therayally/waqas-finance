<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Sign in · Waqas' Finance Growth Strategy</title>
<link rel="stylesheet" href="/app.css">

</head>
<body>
<div id="gate" class="login-wrap">
  <form class="login-card" id="loginForm" method="post" action="/api/login" autocomplete="off">
    <div class="login-header"><div class="dot" aria-hidden="true"></div><h1>Waqas' Finance Growth Strategy</h1><p>&amp;Shawarma · Aug–Oct 2026</p></div>
    <div class="field"><label for="u">Name</label><input class="input" id="u" name="username" autocomplete="username" spellcheck="false" autocapitalize="off" required></div>
    <div class="field"><label for="p">Password</label><input class="input" id="p" name="password" type="password" autocomplete="current-password" required></div>
    <button type="submit" class="btn btn-primary signin">Sign in</button>
    <div class="err" id="err" role="alert"></div>
  </form>
</div>

<script src="/login.js" defer></script>
</body>
</html>

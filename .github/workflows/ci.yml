# Every push and pull request: the security tests, a dependency vulnerability (CVE) check and a secret scan.
# Least privilege: the workflow token can only read the code.
name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Known vulnerabilities in dependencies (CVE)
        run: npm audit --audit-level=moderate
      - name: Package signatures and provenance
        run: npm audit signatures
      - name: Secret scan (no keys, passwords or tokens committed)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
